[workspace]
members = ["crates/sim", "crates/game"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

# Bevy is slow unoptimised. Our own code stays quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
codegen-units = 1
