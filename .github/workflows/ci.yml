name: CI

on:
  push:
    branches: [main]
  pull_request:

# Godot 4.7.2 stable, commit ed1daf0bf (18 August 2026).
# Editor zip sha256 is pinned below. Export templates are the matching
# official 4.7.2-stable package.

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  GODOT_EDITOR_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
  GODOT_TEMPLATES_SHA256: "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011"

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: OSM import tests
        run: python3 -m unittest tests/test_import.py

      - name: Install Godot editor
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  godot.zip" | sha256sum -c
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_TAG}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Cache export templates
        uses: actions/cache@v4
        id: templates
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ env.GODOT_TAG }}

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  templates.tpz" | sha256sum -c
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: godot --headless --import --path . --quit

      - name: Headless tests
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Load the main scene
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 2 > /tmp/godot-boot.log 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-boot.log; then
            cat /tmp/godot-boot.log
            exit 1
          fi

      - name: Export Linux and Windows
        run: |
          set -euo pipefail
          mkdir -p build/linux build/windows
          godot --headless --path . --export-release "Linux" build/linux/Northeast.x86_64
          godot --headless --path . --export-release "Windows Desktop" build/windows/Northeast.exe
          test -f build/linux/Northeast.x86_64
          test -f build/windows/Northeast.exe
          ls -lh build/linux build/windows

      - uses: actions/upload-artifact@v4
        with:
          name: northeast-linux
          path: build/linux/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: northeast-windows
          path: build/windows/
          if-no-files-found: error
