name: CI

on:
  push:
    branches: [main]
  pull_request:

# The game is Rust (the Godot project was retired on 19 November 2026).
# crates/sim holds the world and the rules with no engine in it, so its tests run
# on Linux. The Bevy client (crates/game) is built and checked on Windows by hand:
# .cargo/config.toml points at the toolchain on the machine it is made on, so the
# runner names its own target.

jobs:
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2

      - name: Rules tests
        run: cargo test -p sim --target x86_64-unknown-linux-gnu
